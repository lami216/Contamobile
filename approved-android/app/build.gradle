plugins { id 'com.android.application' }

// Customer APKs must keep one private signing key for their entire lifetime.
// Never fall back to the machine-generated debug identity on a release build.
def signingEnvironment = ['ALKARNA_KEYSTORE_PATH', 'ALKARNA_STORE_PASSWORD', 'ALKARNA_KEY_ALIAS', 'ALKARNA_KEY_PASSWORD']
def hasReleaseSigning = signingEnvironment.every { System.getenv(it)?.trim() }
def approvedVersionCode = providers.gradleProperty('alkarnaVersionCode').map { it.toInteger() }.getOrElse(14)
def approvedVersionName = providers.gradleProperty('alkarnaVersionName').getOrElse('1.0.13-trial')
// Public deployment metadata, confirmed by the owner from the current service export.
def servicePublic = new groovy.json.JsonSlurper().parse(rootProject.file('contatools-public.json'))
def serviceOrigin = System.getenv('CONTATOOLS_ORIGIN') ?: servicePublic.CONTATOOLS_ORIGIN
def serviceIssuers = System.getenv('CONTATOOLS_ISSUERS') ? new groovy.json.JsonSlurper().parseText(System.getenv('CONTATOOLS_ISSUERS')) : servicePublic.CONTATOOLS_ISSUERS
def originUri = new URI(serviceOrigin ?: '')
if (originUri.scheme != 'https' || !originUri.host || originUri.userInfo || originUri.query || originUri.fragment || !(originUri.path in ['', '/'])) throw new GradleException('A fixed real HTTPS service origin is mandatory.')
if (!(serviceIssuers instanceof Map) || serviceIssuers.isEmpty()) throw new GradleException('Public verification issuers are mandatory.')
serviceIssuers.each { kid, key ->
 if (!(key instanceof Map) || key.keySet() != ['kty','crv','x','y'].toSet() || key.kty != 'EC' || key.crv != 'P-256' || !(key.x ==~ '[A-Za-z0-9_-]{43}') || !(key.y ==~ '[A-Za-z0-9_-]{43}')) throw new GradleException('Only public P-256 verification keys may be embedded.')
}
android {
 namespace 'mr.alkarna.mobile.approved'
 compileSdk 35
 defaultConfig {
  applicationId 'mr.alkarna.mobile.approved'; minSdk 26; targetSdk 35; versionCode approvedVersionCode; versionName approvedVersionName; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  // Public fixed deployment metadata only; release candidates cannot be unconfigured.
  buildConfigField 'String', 'CONTATOOLS_ORIGIN', groovy.json.JsonOutput.toJson(serviceOrigin)
  buildConfigField 'String', 'CONTATOOLS_ISSUERS', groovy.json.JsonOutput.toJson(groovy.json.JsonOutput.toJson(serviceIssuers))
 }
 buildFeatures { buildConfig true }
 testBuildType 'release'
 signingConfigs {
  release {
   if (hasReleaseSigning) {
    storeFile file(System.getenv('ALKARNA_KEYSTORE_PATH'))
    storeType 'PKCS12'
    storePassword System.getenv('ALKARNA_STORE_PASSWORD')
    keyAlias System.getenv('ALKARNA_KEY_ALIAS')
    keyPassword System.getenv('ALKARNA_KEY_PASSWORD')
   }
  }
 }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false; debuggable false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

gradle.taskGraph.whenReady { graph ->
 if (graph.allTasks.any { it.project == project && it.name in ['assembleRelease','bundleRelease','packageRelease','installRelease'] }) {
  def highest = System.getenv('ALKARNA_HIGHEST_DISTRIBUTED_CODE')
  def previous = System.getenv('ALKARNA_PREVIOUS_APK_SHA256')
  if (!(highest ==~ '[0-9]+') || !(previous ==~ '[a-f0-9]{64}') || !providers.gradleProperty('alkarnaVersionCode').isPresent() || !providers.gradleProperty('alkarnaVersionName').isPresent()) throw new GradleException('Owner-confirmed distributed versionCode, prior APK SHA-256 and explicit candidate version are required; no guessing.')
  if (approvedVersionCode <= highest.toInteger() || approvedVersionCode > 2100000000) throw new GradleException('Candidate versionCode must exceed the highest actually distributed code.')
  if (serviceOrigin != servicePublic.CONTATOOLS_ORIGIN || serviceIssuers != servicePublic.CONTATOOLS_ISSUERS) throw new GradleException('Distribution must use the owner-confirmed production origin and public keys.')
 }

 if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) {
  if (!hasReleaseSigning) throw new GradleException('Persistent release signing is required. No debug-key fallback is allowed.')
  def store = java.security.KeyStore.getInstance('PKCS12')
  new File(System.getenv('ALKARNA_KEYSTORE_PATH')).withInputStream { store.load(it, System.getenv('ALKARNA_STORE_PASSWORD').toCharArray()) }
  def certificate = store.getCertificate(System.getenv('ALKARNA_KEY_ALIAS'))
  if (certificate == null || !store.isKeyEntry(System.getenv('ALKARNA_KEY_ALIAS'))) throw new GradleException('Release signing key is missing.')
  def actual = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString()
  def expected = rootProject.file('signing-certificate.sha256').text.trim()
  if (actual != expected) throw new GradleException('Signing certificate changed. Refusing an APK that cannot update existing installations.')
 }
}
dependencies {
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 implementation 'androidx.webkit:webkit:1.14.0'
 implementation 'androidx.fragment:fragment:1.8.6'
 implementation 'androidx.camera:camera-camera2:1.4.2'
 implementation 'androidx.camera:camera-lifecycle:1.4.2'
 implementation 'androidx.camera:camera-view:1.4.2'
 implementation 'com.google.mlkit:barcode-scanning:17.3.0'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test:rules:1.6.1'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test:core:1.6.1'
 androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
 androidTestImplementation 'com.google.zxing:core:3.5.3'
}
