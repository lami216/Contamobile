name: Golden Android APK

on:
  workflow_dispatch:
  push:
    branches: [feat/stitch-golden-android]
    paths-ignore:
      - scripts/stitch-visual-qa.py
      - .github/workflows/stitch-golden-verify.yml
      - .github/workflows/stitch-golden-apk.yml

permissions:
  contents: read

concurrency:
  group: golden-apk-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, lint and accounting tests
        run: npm run check
      - name: Prepare pinned offline Stitch fonts
        run: python3 scripts/prepare-stitch-fonts.py
      - name: Verify Android JavaScript bundle
        run: npx expo export --platform android --output-dir dist-check
      - name: Generate native Android release
        run: npx expo prebuild --platform android --clean --no-install
      - name: Create isolated review signing key
        shell: bash
        run: |
          set -euo pipefail
          SIGN_PASS=$(openssl rand -hex 24)
          echo "::add-mask::$SIGN_PASS"
          echo "GOLDEN_SIGN_PASS=$SIGN_PASS" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore "$RUNNER_TEMP/golden-review.p12" -storetype PKCS12 -alias golden-review -keyalg RSA -keysize 2048 -validity 3650 -storepass "$SIGN_PASS" -keypass "$SIGN_PASS" -dname "CN=Contamobile Golden Review, O=Contamobile, C=MR"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          start = s.index('    signingConfigs {')
          end = s.index('    buildTypes {', start)
          s = s[:start] + '''    signingConfigs {
              reviewRelease {
                  storeFile file(System.getenv("RUNNER_TEMP") + "/golden-review.p12")
                  storePassword System.getenv("GOLDEN_SIGN_PASS")
                  keyAlias "golden-review"
                  keyPassword System.getenv("GOLDEN_SIGN_PASS")
              }
          }
          ''' + s[end:]
          s = s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.reviewRelease')
          p.write_text(s)
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build standalone APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android :app:processReleaseResources --no-daemon --stacktrace
          ./android/gradlew -p android assembleRelease --no-daemon --stacktrace --build-cache -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
          mkdir -p release-output/fonts
          cp assets/fonts/* release-output/fonts/
          cp android/app/build/outputs/apk/release/app-release.apk release-output/contamobile-golden.apk
      - name: Verify signature and non-debug release manifest
        shell: bash
        run: |
          set -euo pipefail
          SDK_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$SDK_TOOLS/apksigner" verify --verbose --print-certs release-output/contamobile-golden.apk | tee release-output/signature.txt
          "$SDK_TOOLS/aapt" dump badging release-output/contamobile-golden.apk > release-output/manifest.txt
          ! grep -q 'application-debuggable' release-output/manifest.txt
          ! grep -qi 'Android Debug' release-output/signature.txt
          unzip -l release-output/contamobile-golden.apk > release-output/files.txt
          grep -q 'assets/index.android.bundle' release-output/files.txt
          ! grep -q 'expo-dev-client' release-output/files.txt
          sha256sum release-output/contamobile-golden.apk > release-output/SHA256SUMS
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cold-start release APK offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size 1080x2340
            adb shell wm density 440
            adb install -r release-output/contamobile-golden.apk
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am start -W -n mr.alkarna.mobile.golden/.MainActivity
            sleep 20
            adb shell pidof mr.alkarna.mobile.golden
            adb shell uiautomator dump /sdcard/golden-home.xml
            adb pull /sdcard/golden-home.xml release-output/golden-home.xml
            adb exec-out screencap -p > release-output/golden-home.png
            adb logcat -d '*:E' > release-output/launch-errors.txt
            ! grep -E 'FATAL EXCEPTION|Unable to load script|Could not connect to development server' release-output/launch-errors.txt
            python3 scripts/stitch-visual-qa.py
      - name: Upload APK and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contamobile-golden-release
          path: release-output/
          if-no-files-found: error
          retention-days: 30

