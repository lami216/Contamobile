name: GitHub Pages web preview (manual)

on:
  workflow_dispatch:

concurrency:
  group: pages-preview-manual
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Export Expo web app
        run: npx expo export --platform web --output-dir dist
      - name: Prepare Pages runtime
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("dist/index.html")
          html = path.read_text(encoding="utf-8")
          registration = """<script>
          if ('serviceWorker' in navigator && !window.crossOriginIsolated) {
            navigator.serviceWorker.register('/Contamobile/coi-serviceworker.js', { scope: '/Contamobile/' })
              .then(function () {
                if (!navigator.serviceWorker.controller) {
                  return navigator.serviceWorker.ready.then(function () {
                    window.location.reload();
                  });
                }
              })
              .catch(function (error) {
                console.error('Cross-origin isolation service worker failed', error);
              });
          }
          </script>"""
          if "coi-serviceworker.js" not in html:
              html = html.replace("</head>", registration + "</head>")
          path.write_text(html, encoding="utf-8")
          Path("dist/404.html").write_text(html, encoding="utf-8")
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: ui-redesign-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
