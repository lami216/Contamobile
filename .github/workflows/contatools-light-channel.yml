name: Contatools light channel (no APK)
on:
  push:
    branches: [feat/live-contatools-light-sync-20261027]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contatools-light-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-source-and-java:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: node --test scripts/test-service-contact.mjs
      - run: java scripts/RegistrationPolicyCheck.java
      - run: python3 scripts/prepare-approved-dependencies.py
      - name: Existing accounting/source regression checks
        run: |
          node scripts/verify-approved-source-navigation.mjs
          node scripts/verify-report-sources.mjs
          node scripts/verify-party-summaries.mjs
          node scripts/verify-french-locale.mjs
          node scripts/verify-feature-domains.mjs
          node scripts/verify-import-features.mjs
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: python3 scripts/prepare-approved-android.py
      - name: Load existing permanent identity for certificate checks only
        env:
          ALKARNA_SIGNING_BUNDLE: ${{ secrets.ALKARNA_SIGNING_BUNDLE }}
        run: python3 scripts/prepare-approved-signing.py
      - name: Compile native changes and run JVM unit tests; never assemble an APK
        run: gradle -p approved-android :app:compileReleaseJavaWithJavac :app:testReleaseUnitTest --no-daemon --stacktrace
      - name: Prove a distribution candidate is refused without confirmed version and previous APK
        run: |
          if gradle -p approved-android :app:assembleRelease --dry-run --no-daemon > "$RUNNER_TEMP/candidate-guard.log" 2>&1; then
            echo 'Candidate guard failed'; exit 1
          fi
          grep -q 'Owner-confirmed distributed versionCode' "$RUNNER_TEMP/candidate-guard.log"
      - name: Remove ephemeral signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/alkarna-signing/release.p12"
