name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [mobile-v1, feat/mobile-ui-parity-20260923]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'babel.config.js'

concurrency:
  group: android-release-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare installable APK
        run: |
          set -e
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          if [ -z "$APK" ]; then
            echo "Release APK was not produced."
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/Alkarna-release.apk
          ls -lh dist/Alkarna-release.apk

      - name: Upload standalone Android app
        uses: actions/upload-artifact@v4
        with:
          name: Alkarna-Android-Release
          path: dist/Alkarna-release.apk
          if-no-files-found: error
          retention-days: 30
