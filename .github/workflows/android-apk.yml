name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [mobile-v1]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'babel.config.js'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify release APK contents
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          echo "APK size: $(du -h "$APK" | cut -f1)"
          unzip -l "$APK" | tee /tmp/apk-files.txt >/dev/null
          if ! grep -q "index.android.bundle" /tmp/apk-files.txt; then
            echo "ERROR: release APK does not contain the bundled JavaScript application."
            exit 1
          fi
          echo "Standalone JavaScript bundle found."
      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
      - name: Upload standalone release APK
        uses: actions/upload-artifact@v4
        with:
          name: alkarna-mobile-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
