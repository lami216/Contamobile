name: Mobile quality

on:
  push:
    branches: [mobile-v1, main, ui-redesign-v2, feat/owner-username-recovery-20261102]
  pull_request:
    branches: [main, mobile-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  approved-runtime:
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.ref == 'refs/heads/feat/owner-username-recovery-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Prepare pinned runtime dependencies and disposable license fixtures
        run: |
          python3 scripts/prepare-approved-dependencies.py
          node scripts/prepare-license-fixtures.mjs
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/runtime-tests" --no-package-lock --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/runtime-tests/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check the shipped runtime and storage contracts
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/runtime-tests/node_modules/playwright
          PLAYWRIGHT_USE_BUNDLED: '1'
        run: |
          node scripts/verify-approved-source-navigation.mjs
          node scripts/verify-invoice-ux.mjs
          node scripts/verify-report-sources.mjs
          node scripts/verify-party-summaries.mjs
          node scripts/verify-french-locale.mjs
          node scripts/verify-feature-domains.mjs
          node scripts/verify-import-features.mjs
          node scripts/test-storage-integrity.mjs
          node scripts/test-runtime-integrity.mjs
          node scripts/test-invoice-ux.mjs
          node scripts/test-accounting-reset.mjs
          node scripts/test-cloud-backup.mjs
          node scripts/test-backup-ux.mjs
          node scripts/test-owner-recovery-ux.mjs
          node scripts/test-user-integrity.mjs
          node scripts/test-import-html-escaping.mjs
          node --test scripts/test-import-allocation.mjs scripts/test-native-adapter.mjs scripts/test-native-save-boundary.mjs scripts/test-cloud-native-adapter.mjs scripts/test-reset-native-adapter.mjs scripts/test-accounting-reset-lock.mjs
      - name: Retain the approved recovery interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-recovery-ux-proof
          path: |
            candidate-proof/owner-recovery-ux-proof.json
            candidate-proof/owner-recovery-ux-*.png
          retention-days: 30
          if-no-files-found: warn

  quality:
    # This tree is retained for provenance. It is not the distributed Android app.
    if: github.ref == 'refs/heads/mobile-v1' || github.ref == 'refs/heads/ui-redesign-v2' || github.base_ref == 'mobile-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Restore Node dependencies
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test


  web-preview:
    if: ${{ github.ref == 'refs/heads/ui-redesign-v2' && github.event_name != 'pull_request' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Restore Node dependencies
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Export Expo web app
        run: npx expo export --platform web --output-dir dist

      - name: Prepare Pages runtime
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("dist/index.html")
          html = path.read_text(encoding="utf-8")
          registration = """<script>
          if ('serviceWorker' in navigator && !window.crossOriginIsolated) {
            navigator.serviceWorker.register('/Contamobile/coi-serviceworker.js', { scope: '/Contamobile/' })
              .then(function () {
                if (!navigator.serviceWorker.controller) {
                  return navigator.serviceWorker.ready.then(function () {
                    window.location.reload();
                  });
                }
              })
              .catch(function (error) {
                console.error('Cross-origin isolation service worker failed', error);
              });
          }
          </script>"""
          if "coi-serviceworker.js" not in html:
              html = html.replace("</head>", registration + "</head>")
          path.write_text(html, encoding="utf-8")
          Path("dist/404.html").write_text(html, encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy-pages:
    if: ${{ github.ref == 'refs/heads/ui-redesign-v2' && github.event_name != 'pull_request' }}
    needs: web-preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: ui-redesign-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

