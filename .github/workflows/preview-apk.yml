name: Android preview APK (manual)

on:
  workflow_dispatch:

concurrency:
  group: android-preview-manual
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir dist-check

  build-apk:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: npm ci --no-audit --no-fund
      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone preview APK
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x android/gradlew
          ./android/gradlew -p android assembleRelease --no-daemon --stacktrace --build-cache
          cp android/app/build/outputs/apk/release/app-release.apk alkarna-ux-preview.apk
          test -s alkarna-ux-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: alkarna-ux-preview-apk
          path: alkarna-ux-preview.apk
          if-no-files-found: error
          retention-days: 14
