name: Recheck Golden Android 0.2.3
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: golden-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Wait for the exact 0.2.3 APK artifact
        env:
          GOLDEN_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,os,time
          url='https://api.github.com/repos/lami216/Contamobile/actions/runs/37163455163/artifacts'
          for attempt in range(60):
            request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GOLDEN_ARTIFACT_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(request,timeout=30) as response:data=json.load(response)
            if any(a['name']=='contamobile-golden-release' for a in data.get('artifacts',[])):
              print('Exact release artifact is ready');break
            if attempt==0:print('Waiting for the existing native build; no APK rebuild is needed')
            time.sleep(15)
          else:raise SystemExit('Release artifact did not become available')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: contamobile-golden-release
          run-id: 37163455163
          github-token: ${{ github.token }}
          path: release-output
      - name: Prepare fresh visual verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('release-output/screenshots')
          if p.exists():p.rename(Path('release-output/previous-screenshots'))
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real workflows on the unchanged Release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size 1080x2340
            adb shell wm density 440
            adb install release-output/contamobile-golden.apk
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am start -W -n mr.alkarna.mobile.golden/.MainActivity
            sleep 20
            python3 scripts/stitch-visual-qa.py
      - name: Upload installable APK only
        uses: actions/upload-artifact@v4
        with:
          name: contamobile-golden-apk
          path: release-output/contamobile-golden.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
