name: Data integrity audit (no release)
on:
  push:
    branches: [audit/data-integrity-20261029]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrity-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime-faults:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Isolated pinned browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/audit-tools" --no-package-lock --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/audit-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Prepare pinned offline SQLite before guarded startup tests
        run: python3 scripts/prepare-approved-dependencies.py
      - name: Real Chromium storage and UI fault injection
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/audit-tools/node_modules/playwright
          PLAYWRIGHT_USE_BUNDLED: '1'
        run: |
          node scripts/test-storage-integrity.mjs
          node scripts/test-runtime-integrity.mjs
          node scripts/test-user-integrity.mjs
          node scripts/test-import-html-escaping.mjs
      - name: Accounting, locale, import, bridge and contact regressions
        run: |
          node --test scripts/test-import-allocation.mjs scripts/test-native-adapter.mjs scripts/test-native-save-boundary.mjs scripts/test-service-contact.mjs
          node scripts/verify-approved-source-navigation.mjs
          node scripts/verify-report-sources.mjs
          node scripts/verify-party-summaries.mjs
          node scripts/verify-french-locale.mjs
          node scripts/verify-feature-domains.mjs
          node scripts/verify-import-features.mjs
          node scripts/verify-data-rescue-entry.mjs
          for file in approved-runtime/*.js; do node --check "$file"; done
  native-device:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: a1ff5140cb14ff659158663368f1d498e7160aef
          path: audit-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile isolated debug apps without release credentials
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          python3 scripts/prepare-approved-android.py
          node scripts/prepare-license-fixtures.mjs
          python3 audit-baseline/scripts/prepare-approved-android.py
          gradle -p audit-baseline/approved-android :app:assembleDebug --no-daemon
          gradle -p approved-android :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest -PalkarnaAuditDebugTests=true --no-daemon --stacktrace
      - name: Disposable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduce old activation defect then prove repaired behavior
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/test-integrity-audit-device.sh
      - name: Preserve test evidence only; never publish the debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-integrity-audit-evidence
          path: |
            audit-proof/
            approved-android/app/build/reports/tests/
            approved-android/app/build/test-results/
