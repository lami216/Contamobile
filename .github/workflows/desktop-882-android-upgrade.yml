name: Desktop main882 signed Android upgrade
on:
  push:
    branches: [feat/desktop-main-followup-20261121]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: desktop882-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.repository == 'lami216/Contamobile' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/feat/desktop-main-followup-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      inputs_id: ${{ steps.inputs.outputs.artifact-id }}
    env:
      ALKARNA_HIGHEST_DISTRIBUTED_CODE: '37'
      ALKARNA_PREVIOUS_APK_SHA256: 457e238783ef8d4874ee40b5120b2737c9a6628325398ba6652898ff78ff5c81
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Retrieve original delivered APKs by artifact ID and pinned hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,io,json,subprocess,zipfile
          from pathlib import Path
          out=Path('build-882');out.mkdir()
          originals=[(27,42388697915,'f4f65f261c82f0c9693b4a142796ac1def4c2544','alkarna-candidate-v27','alkarna-1.0.26-v27.apk','174da0f4e076250cda7aa436f9b776d1b6bebd5c60a6cd543d5702b9ac4a55e3'),(37,44920409474,'f79c458ea28fa7204a7a9ad01b628bf2fa089686','desktop879-v37-verified-update','alkarna-1.0.36-v37.apk','457e238783ef8d4874ee40b5120b2737c9a6628325398ba6652898ff78ff5c81')]
          provenance=[]
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/lami216/Contamobile/'+path],text=True))
          for version,run,head,name,filename,digest in originals:
              metadata=api(f'actions/runs/{run}');assert metadata['head_sha']==head and metadata['conclusion']=='success'
              artifacts=api(f'actions/runs/{run}/artifacts?per_page=100')['artifacts']
              found=[a for a in artifacts if a['name']==name and not a['expired']];assert len(found)==1
              artifact=found[0];data=subprocess.check_output(['gh','api',f'repos/lami216/Contamobile/actions/artifacts/{artifact["id"]}/zip'])
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  entry=archive.getinfo(filename);assert 0<entry.file_size<100*1024*1024
                  apk=archive.read(entry)
              assert hashlib.sha256(apk).hexdigest()==digest
              (out/f'baseline-v{version}.apk').write_bytes(apk)
              provenance.append({'versionCode':version,'runId':run,'sourceHead':head,'artifactId':artifact['id'],'sha256':digest})
          (out/'originals.json').write_text(json.dumps(provenance,indent=2)+'\n')
          PY
      - name: Prepare the exact frozen phone runtime and test fixtures
        run: |
          python3 scripts/prepare-approved-android.py
          node scripts/prepare-license-fixtures.mjs
          node scripts/verify-882-package.mjs
          bash -n scripts/test-882-android-upgrade.sh
      - name: Use the existing permanent signing identity
        env:
          ALKARNA_SIGNING_BUNDLE: ${{ secrets.ALKARNA_SIGNING_BUNDLE }}
        run: python3 scripts/prepare-approved-signing.py
      - name: Build the signed candidate and instrumentation ONCE
        run: |
          gradle -p approved-android :app:assembleRelease :app:assembleReleaseAndroidTest :app:testReleaseUnitTest -PalkarnaVersionCode=38 -PalkarnaVersionName=1.0.37 --no-daemon --stacktrace
          cp approved-android/app/build/outputs/apk/release/app-release.apk build-882/alkarna-1.0.37-v38.apk
          cp approved-android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk build-882/app-release-androidTest.apk
          python3 scripts/verify-native-jvm-results.py approved-android/app/build/test-results/testReleaseUnitTest build-882/jvm-summary.json
          python3 scripts/verify-activation-package.py build-882/alkarna-1.0.37-v38.apk
          python3 scripts/verify-contatools-apk.py build-882/alkarna-1.0.37-v38.apk
          python3 scripts/verify-approved-signature.py build-882/baseline-v27.apk build-882/baseline-v37.apk build-882/alkarna-1.0.37-v38.apk build-882/app-release-androidTest.apk
      - name: Seal package identity and immutable source/build inputs
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          root=Path('build-882');aapt=str(Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0/aapt')
          for file,expected in [('alkarna-1.0.37-v38.apk',('mr.alkarna.mobile.approved','38','1.0.37')),('baseline-v37.apk',('mr.alkarna.mobile.approved','37','1.0.36')),('baseline-v27.apk',('mr.alkarna.mobile.approved','27','1.0.26'))]:
              text=subprocess.check_output([aapt,'dump','badging',str(root/file)],text=True)
              found=re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'",text,re.M)
              assert found and found.groups()==expected
          test=subprocess.check_output([aapt,'dump','badging',str(root/'app-release-androidTest.apk')],text=True)
          assert "package: name='mr.alkarna.mobile.approved.test'" in test
          source=[p for p in subprocess.check_output(['git','ls-files'],text=True).splitlines() if p.startswith(('approved-runtime/','approved-android/app/src/androidTest/','approved-android/app/src/main/java/','scripts/test-882-android-upgrade.sh','.github/workflows/desktop-882-android-upgrade.yml','approved-android/contatools-public.json','approved-android/app/build.gradle'))]
          files=['alkarna-1.0.37-v38.apk','app-release-androidTest.apk','baseline-v27.apk','baseline-v37.apk','jvm-summary.json']
          result={'schema':'alkarna-desktop882-signed-inputs-v1','sourceHead':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'versionCode':38,'versionName':'1.0.37','originals':json.loads((root/'originals.json').read_text()),'files':{f:hashlib.sha256((root/f).read_bytes()).hexdigest() for f in files},'sourceFiles':{f:hashlib.sha256(Path(f).read_bytes()).hexdigest() for f in source}}
          (root/'inputs.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        id: inputs
        with:
          name: desktop882-v38-signed-build-inputs
          path: build-882/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Remove ephemeral signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/alkarna-signing/release.p12"
  native:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      proof_id: ${{ steps.proof.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.inputs_id }}
          path: build-882
          merge-multiple: true
      - name: Enable isolated VM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_882_MODE: native
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          disable-animations: true
          script: bash scripts/test-882-android-upgrade.sh
      - uses: actions/upload-artifact@v4
        id: proof
        if: always()
        with:
          name: desktop882-v38-native-proof
          path: android882-proof/
          retention-days: 30
          if-no-files-found: error
  upgrade:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        baseline: [27, 37]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.inputs_id }}
          path: build-882
          merge-multiple: true
      - name: Enable isolated VM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_882_MODE: upgrade
          UPGRADE_BASELINE: ${{ matrix.baseline }}
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          disable-animations: true
          script: bash scripts/test-882-android-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop882-v38-upgrade-v${{ matrix.baseline }}-proof
          path: android882-proof/
          retention-days: 30
          if-no-files-found: error
  verified:
    needs: [build, native, upgrade]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.inputs_id }}
          path: build-882
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop882-v38-*-proof
          path: verified-proof
      - name: Require matching successful results for the identical signed build
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          inputs=json.loads(Path('build-882/inputs.json').read_text());results=[]
          for path in Path('verified-proof').rglob('result.json'):
              result=json.loads(path.read_text());assert result['passed'] and result['sourceHead']==os.environ['GITHUB_SHA'] and result['runId']==os.environ['GITHUB_RUN_ID']
              assert result['schema']=='alkarna-desktop882-android-result-v1'
              assert result['candidateSha256']==inputs['files']['alkarna-1.0.37-v38.apk'] and result['testApkSha256']==inputs['files']['app-release-androidTest.apk']
              if result['mode']=='native':assert result['nativeTestCount']==75
              else:assert len(result['checks'])==8 and all(c['passed'] for c in result['checks'])
              results.append(result)
          assert len(results)==3 and sum(r['mode']=='native' for r in results)==1 and {int(r['baseline']) for r in results if r['mode']=='upgrade'}=={27,37}
          apk=Path('build-882/alkarna-1.0.37-v38.apk');assert hashlib.sha256(apk.read_bytes()).hexdigest()==inputs['files'][apk.name]
          out=Path('verified-candidate');out.mkdir();(out/apk.name).write_bytes(apk.read_bytes());(out/'verification.json').write_text(json.dumps({'inputs':inputs,'results':results},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: desktop882-v38-verified-update
          path: verified-candidate/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
