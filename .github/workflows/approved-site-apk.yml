name: Approved seller app APK
on:
  push:
    branches: [feat/approved-seller-app]
    paths: ['approved-android/**', 'approved-runtime/**', 'scripts/prepare-approved-*.py', 'scripts/verify-approved-signature.py', 'scripts/test-approved-*', '.github/workflows/approved-site-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: approved-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install pinned Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare pinned offline SQLite dependency
        run: python3 scripts/prepare-approved-dependencies.py
      - name: Verify source navigation regression
        run: node scripts/verify-approved-source-navigation.mjs
      - name: Verify report sources and reconciliation
        run: node scripts/verify-report-sources.mjs
      - name: Verify customer and supplier historical totals
        run: node scripts/verify-party-summaries.mjs
      - name: Verify French locale, LTR outputs and original user data
        run: node scripts/verify-french-locale.mjs
      - name: Verify report scopes, statements, categories, currency and permissions
        run: node scripts/verify-feature-domains.mjs
      - name: Verify SQLite import, conflict policies and repeat safety
        run: node scripts/verify-import-features.mjs
      - name: Package pinned approved site
        run: python3 scripts/prepare-approved-android.py
      - name: Prepare independent desktop license contract fixtures
        run: node scripts/prepare-license-fixtures.mjs
      - name: Load the permanent release signing identity
        env:
          ALKARNA_SIGNING_BUNDLE: ${{ secrets.ALKARNA_SIGNING_BUNDLE }}
        run: python3 scripts/prepare-approved-signing.py
      - name: Verify signing credential handling
        run: python3 scripts/test-approved-signing.py
      - name: Check out the actual previously delivered 1.0.11 source
        uses: actions/checkout@v4
        with:
          ref: ff82a0e0e709ac5bed7d5f4118147ede900fd76c
          path: previous-release
      - name: Build the previous release with the same permanent key
        run: |
          python3 previous-release/scripts/prepare-approved-android.py
          gradle -p previous-release/approved-android :app:assembleRelease --no-daemon --stacktrace
          mkdir -p approved-upgrade
          cp previous-release/approved-android/app/build/outputs/apk/release/app-release.apk approved-upgrade/previous.apk
      - name: Build installable non-debug APK and device tests
        run: |
          gradle -p approved-android :app:assembleRelease :app:assembleReleaseAndroidTest --no-daemon --stacktrace
          mkdir -p approved-output
          echo ff82a0e0e709ac5bed7d5f4118147ede900fd76c > approved-output/previous-source.txt
          cp approved-android/app/build/outputs/apk/release/app-release.apk approved-output/alkarna-approved.apk
          python3 scripts/verify-activation-package.py approved-output/alkarna-approved.apk
          python3 scripts/verify-approved-signature.py approved-upgrade/previous.apk approved-output/alkarna-approved.apk > approved-output/signature.txt
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs approved-output/alkarna-approved.apk >> approved-output/signature.txt
          sha256sum approved-output/alkarna-approved.apk > approved-output/SHA256SUMS.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline Android seller workflow and cold persistence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/test-approved-android.sh
      - name: Remove ephemeral signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/alkarna-signing/release.p12"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: alkarna-approved-apk
          path: approved-output/alkarna-approved.apk
          compression-level: 0
          if-no-files-found: error
      - name: Upload device proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alkarna-approved-proof
          path: |
            approved-output/*.txt
            approved-output/screenshots
            approved-android/app/build/reports/androidTests
          if-no-files-found: warn
