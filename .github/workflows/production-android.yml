name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [ui-redesign-v2]
    paths:
      - '.github/workflows/production-android.yml'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: true
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Node dependencies
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Quality gate
        run: npm run check

      - name: Verify Android JavaScript export
        run: npx expo export --platform android --output-dir dist-check

      - name: Report signing path
        shell: bash
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "EAS credentials detected: building with EAS production signing."
          else
            echo "::notice::EXPO_TOKEN is not configured. Building the Android release variant locally instead."
            echo "::notice::This is a non-debug release APK, but its signing certificate is not a Play/EAS production credential."
          fi

      - name: Link Expo project
        if: ${{ env.EXPO_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest whoami
          npx --yes eas-cli@latest init --non-interactive --force

      - name: Build EAS production-signed APK
        if: ${{ env.EXPO_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build \
            --platform android \
            --profile production-apk \
            --non-interactive \
            --wait \
            --json > eas-build.json

      - name: Download EAS APK
        if: ${{ env.EXPO_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const parsed = JSON.parse(fs.readFileSync('eas-build.json', 'utf8'));
          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          const url = build?.artifacts?.buildUrl ?? build?.artifacts?.applicationArchiveUrl;
          if (!url) {
            console.error('No APK URL was returned by EAS.');
            console.error(JSON.stringify(build, null, 2));
            process.exit(1);
          }
          fs.writeFileSync('/tmp/eas-build-url.txt', url);
          fs.writeFileSync('release-build-info.json', JSON.stringify({
            source: 'eas-production',
            id: build?.id ?? null,
            platform: build?.platform ?? 'ANDROID',
            profile: 'production-apk',
            status: build?.status ?? null,
            artifactUrl: url
          }, null, 2));
          NODE
          curl --fail --location "$(cat /tmp/eas-build-url.txt)" --output alkarna-release.apk
          test -s alkarna-release.apk

      - name: Generate native Android project
        if: ${{ env.EXPO_TOKEN == '' }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore Gradle cache
        if: ${{ env.EXPO_TOKEN == '' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-release-${{ runner.os }}-

      - name: Build local release APK
        if: ${{ env.EXPO_TOKEN == '' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          ./android/gradlew -p android assembleRelease --no-daemon --stacktrace --build-cache --parallel
          cp android/app/build/outputs/apk/release/app-release.apk alkarna-release.apk
          test -s alkarna-release.apk
          node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('release-build-info.json', JSON.stringify({
            source: 'local-gradle-release',
            profile: 'release',
            note: 'Non-debug Android release variant. Play/EAS production signing requires EXPO_TOKEN.'
          }, null, 2));
          NODE

      - name: Verify standalone release APK
        shell: bash
        run: |
          set -euo pipefail

          unzip -l alkarna-release.apk | tee /tmp/apk-files.txt >/dev/null
          if ! grep -q "index.android.bundle" /tmp/apk-files.txt; then
            echo "::error::Release APK does not contain the bundled JavaScript application."
            exit 1
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ -z "$AAPT" ]; then
            echo "::error::Android build-tools verification utilities were not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs alkarna-release.apk | tee release-signature.txt
          "$AAPT" dump badging alkarna-release.apk | tee release-badging.txt >/dev/null

          if grep -q "application-debuggable" release-badging.txt; then
            echo "::error::APK is debuggable; refusing to publish it as a release artifact."
            exit 1
          fi

          if [ -n "$EXPO_TOKEN" ] && grep -qi "Android Debug" release-signature.txt; then
            echo "::error::EAS production build unexpectedly uses the Android debug certificate."
            exit 1
          fi

          if [ -z "$EXPO_TOKEN" ] && grep -qi "Android Debug" release-signature.txt; then
            echo "::warning::Release variant is signed with the generated Android debug certificate because no production signing credential is configured."
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: alkarna-release-apk-${{ github.sha }}
          path: |
            alkarna-release.apk
            release-build-info.json
            release-signature.txt
            release-badging.txt
          if-no-files-found: error
          retention-days: 30
