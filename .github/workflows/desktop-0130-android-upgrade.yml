name: Desktop0.1.30 parity and signed Android40 update
on:
  push:
    branches: [feat/desktop-main-parity-20261123]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: parity0130-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  business:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAYWRIGHT_MODULE: ${{ github.workspace }}/parity-browser/node_modules/playwright
      PLAYWRIGHT_USE_BUNDLED: '1'
      DESKTOP_MAIN_SOURCE: ${{ github.workspace }}/desktop-0130-source
      DESKTOP_0130_ROOT: ${{ github.workspace }}/desktop-0130-source
      DESKTOP_LATEST_ROOT: ${{ github.workspace }}/desktop-consumer
      DESKTOP_862_ROOT: ${{ github.workspace }}/desktop-862-source
      DESKTOP_862_SOURCE: ${{ github.workspace }}/desktop-862-source
      DESKTOP_870_ROOT: ${{ github.workspace }}/desktop-870-source
      DESKTOP_870_SOURCE: ${{ github.workspace }}/desktop-870-source
      DESKTOP_879_ROOT: ${{ github.workspace }}/desktop-879-source
      DESKTOP_879_SOURCE: ${{ github.workspace }}/desktop-879-source
      DESKTOP_882_ROOT: ${{ github.workspace }}/desktop-882-source
      DESKTOP_882_SOURCE: ${{ github.workspace }}/desktop-882-source
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: lami216/offline-conta
          ref: bdcdf2dba16d09489da9d7ee7942a7eb5ab7f2a0
          path: desktop-862-source
      - uses: actions/checkout@v4
        with:
          repository: lami216/offline-conta
          ref: e4cbe46fd59e302140e6d885c69ca98376d4a00d
          path: desktop-870-source
      - uses: actions/checkout@v4
        with:
          repository: lami216/offline-conta
          ref: 8a6cb072c411ee698f3ca5a0f1943be80ccd2955
          path: desktop-879-source
      - uses: actions/checkout@v4
        with:
          repository: lami216/offline-conta
          ref: f1cd62bf6fbd8cbaef49a479aff440027afba37b
          path: desktop-882-source
      - uses: actions/checkout@v4
        with:
          repository: lami216/offline-conta
          ref: 2327ccc83b3f76f7a30d13c0ca8d356c4cd7483b
          path: desktop-0130-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lami216/offline-conta
          ref: 0076de06cd20b5f0dfd83918a264373aa3df0071
          path: desktop-consumer
          persist-credentials: false
      - name: Require immutable Desktop source and paired consumer heads
        run: |
          test "$(git -C desktop-0130-source rev-parse HEAD)" = 2327ccc83b3f76f7a30d13c0ca8d356c4cd7483b
          test "$(git -C desktop-consumer rev-parse HEAD)" = 0076de06cd20b5f0dfd83918a264373aa3df0071
          test "$(git -C desktop-consumer rev-parse HEAD^{tree})" = 609d3ca450b94ad591a7747f718e80deb472afda
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned browser and runtime dependencies
        run: |
          npm install --prefix parity-browser --ignore-scripts --no-audit --no-fund playwright@1.62.1
          timeout --kill-after=30s 600s parity-browser/node_modules/.bin/playwright install-deps chromium
          for attempt in 1 2 3; do
            if timeout --kill-after=30s 240s parity-browser/node_modules/.bin/playwright install chromium --only-shell; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 3
          done
          python scripts/prepare-approved-android.py
          cp assets/fonts/StitchArabic*.ttf approved-runtime/assets/
      - name: Preserve existing source comparisons and domain regressions
        run: node scripts/test-862-regressions.mjs
      - name: Compare new rules with the exact Desktop 870 source
        run: |
          node scripts/test-payroll-parity-870.mjs
          node scripts/test-stock-parity-870.mjs
          node scripts/test-shared-contract-870.mjs
          node scripts/test-reports-parity-870.mjs
      - name: Compare main879 rules with the exact merged Desktop source
        run: |
          node scripts/test-payroll-parity-879.mjs
          node scripts/test-shared-contract-879.mjs
          node scripts/test-reports-parity-879.mjs
          node scripts/test-expense-parity-879.mjs
      - name: Compare current main882 notes and legacy journal rules
        run: |
          node scripts/test-movement-notes-parity-882.mjs
          node scripts/test-statement-parity-882.mjs
          node scripts/test-movement-import-882.mjs
      - name: Preserve mobile storage, activation, recovery and workflows
        run: node scripts/test-862-regressions.mjs --browser
      - name: Preserve existing workspaces and finance integration
        run: |
          node scripts/test-business-workspaces-862.mjs
          node scripts/test-mobile-finance-862-ux.mjs
          node scripts/test-862-historical-edges-ux.mjs
          node scripts/test-862-final-parity-ux.mjs
          node scripts/test-business-identity-ux-862.mjs
          node scripts/test-pos-draft-lifecycle-862.mjs
      - name: Exercise new mobile flows and frozen package
        run: |
          node scripts/test-workers-870-ux.mjs
          node scripts/test-stock-parity-870-ux.mjs
          node scripts/test-workers-879-ux.mjs
          node scripts/test-expense-879-ux.mjs
          node scripts/test-report-source-879-ux.mjs
          node scripts/test-movement-notes-882-ux.mjs
          node scripts/test-movement-statements-882-ux.mjs
          node scripts/test-movement-bank-882-ux.mjs
          node scripts/verify-parity0130-package.mjs
      - name: Prove latest Desktop0.1.30 business, notes and atomic creation
        run: |
          node scripts/test-product-cost-parity-0130.mjs
          node scripts/test-imported-history-parity-0130.mjs
          node scripts/test-desktop-snapshot-parity-0130.mjs
          node scripts/test-party-metrics-main-parity.mjs
          node scripts/test-profit-breakdown-0130-ux.mjs
          node scripts/test-document-notes-main-parity.mjs
          node scripts/test-document-notes-main-ux.mjs
          node scripts/test-long-movement-notes-0130-ux.mjs
          node scripts/test-history-parity-0130-ux.mjs
          node scripts/test-business-interchange-ux.mjs
          node --experimental-transform-types --test scripts/test-desktop-business-interchange.mjs
          node --test scripts/test-own-business-merge.mjs
          node scripts/test-product-optional-fields-0130-ux.mjs
          node --test scripts/test-recovery-diagnostics.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute actual Desktop SQLite consumer roundtrip
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          npm ci --prefix desktop-consumer --no-audit --no-fund
          node --import "$GITHUB_WORKSPACE/desktop-consumer/node_modules/tsx/dist/loader.mjs" --test scripts/test-desktop-business-sqlite.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop0130-business-proof
          path: |
            outputs/main-parity-qa/
            outputs/desktop0130-qa/
            candidate-proof/
            outputs/desktop882-qa/
            outputs/desktop879-qa/
            outputs/desktop870-qa/
            outputs/desktop862-qa/
          if-no-files-found: error
  build:
    if: >-
      github.repository == 'lami216/Contamobile' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/feat/desktop-main-parity-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      inputs_id: ${{ steps.inputs.outputs.artifact-id }}
    env:
      ALKARNA_HIGHEST_DISTRIBUTED_CODE: '39'
      ALKARNA_PREVIOUS_APK_SHA256: bca79ebb844ac18c65ea8ece27dc4cc3ee1aee8e5e60bae025143fb11bbe2b4d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Retrieve original delivered APKs by artifact ID and pinned hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,io,json,subprocess,zipfile
          from pathlib import Path
          out=Path('build-parity0130');out.mkdir()
          originals=[(27,42388697915,'f4f65f261c82f0c9693b4a142796ac1def4c2544','alkarna-candidate-v27','alkarna-1.0.26-v27.apk','174da0f4e076250cda7aa436f9b776d1b6bebd5c60a6cd543d5702b9ac4a55e3'),(39,44972098486,'098ea6a5aeea00ac6ccd3c60f5b53205d54fca01','recovery39-v39-verified-update','alkarna-1.0.38-v39.apk','bca79ebb844ac18c65ea8ece27dc4cc3ee1aee8e5e60bae025143fb11bbe2b4d')]
          provenance=[]
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/lami216/Contamobile/'+path],text=True))
          for version,run,head,name,filename,digest in originals:
              metadata=api(f'actions/runs/{run}');assert metadata['head_sha']==head and metadata['conclusion']=='success'
              artifacts=api(f'actions/runs/{run}/artifacts?per_page=100')['artifacts']
              found=[a for a in artifacts if a['name']==name and not a['expired']];assert len(found)==1
              artifact=found[0]
              if version==39:assert artifact['id']==14734480899,'Original39 artifact ID changed'
              data=subprocess.check_output(['gh','api',f'repos/lami216/Contamobile/actions/artifacts/{artifact["id"]}/zip'])
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  entry=archive.getinfo(filename);assert 0<entry.file_size<100*1024*1024
                  apk=archive.read(entry)
              assert hashlib.sha256(apk).hexdigest()==digest
              (out/f'baseline-v{version}.apk').write_bytes(apk)
              provenance.append({'versionCode':version,'runId':run,'sourceHead':head,'artifactId':artifact['id'],'sha256':digest})
          (out/'originals.json').write_text(json.dumps(provenance,indent=2)+'\n')
          PY
      - name: Prepare the exact frozen phone runtime and test fixtures
        run: |
          python3 scripts/prepare-approved-android.py
          node scripts/prepare-license-fixtures.mjs
          node scripts/verify-parity0130-package.mjs
          bash -n scripts/test-parity0130-android-upgrade.sh
          java scripts/RegistrationPolicyCheck.java | tee build-parity0130/registration-policy.txt
          java scripts/RecoveryFailureCheck.java | tee build-parity0130/recovery-diagnostics.txt
          node --test scripts/test-recovery-diagnostics.mjs
      - name: Use the existing permanent signing identity
        env:
          ALKARNA_SIGNING_BUNDLE: ${{ secrets.ALKARNA_SIGNING_BUNDLE }}
        run: python3 scripts/prepare-approved-signing.py
      - name: Build the signed candidate and instrumentation ONCE
        run: |
          gradle -p approved-android :app:assembleRelease :app:assembleReleaseAndroidTest :app:testReleaseUnitTest -PalkarnaVersionCode=40 -PalkarnaVersionName=1.0.39 -PalkarnaParity0130Tests=true --no-daemon --stacktrace
          cp approved-android/app/build/outputs/apk/release/app-release.apk build-parity0130/alkarna-1.0.39-v40.apk
          cp approved-android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk build-parity0130/app-release-androidTest.apk
          python3 scripts/verify-native-jvm-results.py approved-android/app/build/test-results/testReleaseUnitTest build-parity0130/jvm-summary.json
          python3 scripts/verify-activation-package.py build-parity0130/alkarna-1.0.39-v40.apk
          python3 scripts/verify-contatools-apk.py build-parity0130/alkarna-1.0.39-v40.apk
          python3 scripts/verify-approved-signature.py build-parity0130/baseline-v27.apk build-parity0130/baseline-v39.apk build-parity0130/alkarna-1.0.39-v40.apk build-parity0130/app-release-androidTest.apk
      - name: Seal package identity and immutable source/build inputs
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          root=Path('build-parity0130');aapt=str(Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0/aapt')
          for file,expected in [('alkarna-1.0.39-v40.apk',('mr.alkarna.mobile.approved','40','1.0.39')),('baseline-v39.apk',('mr.alkarna.mobile.approved','39','1.0.38')),('baseline-v27.apk',('mr.alkarna.mobile.approved','27','1.0.26'))]:
              text=subprocess.check_output([aapt,'dump','badging',str(root/file)],text=True)
              found=re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'",text,re.M)
              assert found and found.groups()==expected
          test=subprocess.check_output([aapt,'dump','badging',str(root/'app-release-androidTest.apk')],text=True)
          assert "package: name='mr.alkarna.mobile.approved.test'" in test
          source=[p for p in subprocess.check_output(['git','ls-files'],text=True).splitlines() if p.startswith(('approved-runtime/','approved-android/app/src/androidTest/','approved-android/parity0130-androidTest/','approved-android/app/src/main/java/','approved-android/app/src/test/','scripts/test-parity0130-android-upgrade.sh','.github/workflows/desktop-0130-android-upgrade.yml','approved-android/contatools-public.json','approved-android/app/build.gradle','approved-android/recovery-release.properties','scripts/RecoveryFailureCheck.java','scripts/RecoveryFailureProbe.java','scripts/RegistrationPolicyCheck.java','scripts/RegistrationPolicyProbe.java','scripts/original-v39-jvm-cases.json','scripts/verify-parity0130-package.mjs','scripts/verify-native-jvm-results.py'))]
          files=['alkarna-1.0.39-v40.apk','app-release-androidTest.apk','baseline-v27.apk','baseline-v39.apk','jvm-summary.json']
          result={'schema':'alkarna-parity0130-signed-inputs-v1','desktopSource':'2327ccc83b3f76f7a30d13c0ca8d356c4cd7483b','desktopConsumerSource':'0076de06cd20b5f0dfd83918a264373aa3df0071','desktopConsumerTree':'609d3ca450b94ad591a7747f718e80deb472afda','sourceHead':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'versionCode':40,'versionName':'1.0.39','originals':json.loads((root/'originals.json').read_text()),'files':{f:hashlib.sha256((root/f).read_bytes()).hexdigest() for f in files},'sourceFiles':{f:hashlib.sha256(Path(f).read_bytes()).hexdigest() for f in source}}
          (root/'inputs.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        id: inputs
        with:
          name: parity0130-v40-signed-build-inputs
          path: build-parity0130/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Remove ephemeral signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/alkarna-signing/release.p12"
  native:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      proof_id: ${{ steps.proof.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.inputs_id }}
          path: build-parity0130
          merge-multiple: true
      - name: Enable isolated VM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_PARITY0130_MODE: native
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          disable-animations: true
          script: bash scripts/test-parity0130-android-upgrade.sh
      - uses: actions/upload-artifact@v4
        id: proof
        if: always()
        with:
          name: parity0130-v40-native-proof
          path: android-parity0130-proof/
          retention-days: 30
          if-no-files-found: error
  upgrade:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        baseline: [27, 39]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.inputs_id }}
          path: build-parity0130
          merge-multiple: true
      - name: Enable isolated VM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_PARITY0130_MODE: upgrade
          UPGRADE_BASELINE: ${{ matrix.baseline }}
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          disable-animations: true
          script: bash scripts/test-parity0130-android-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity0130-v40-upgrade-v${{ matrix.baseline }}-proof
          path: android-parity0130-proof/
          retention-days: 30
          if-no-files-found: error
  verified:
    needs: [business, build, native, upgrade]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.inputs_id }}
          path: build-parity0130
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: parity0130-v40-*-proof
          path: verified-proof
      - name: Require matching successful results for the identical signed build
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          inputs=json.loads(Path('build-parity0130/inputs.json').read_text());results=[]
          for path in Path('verified-proof').rglob('result.json'):
              result=json.loads(path.read_text());assert result['passed'] and result['sourceHead']==os.environ['GITHUB_SHA'] and result['runId']==os.environ['GITHUB_RUN_ID']
              assert result['schema']=='alkarna-parity0130-android-result-v1'
              assert result['candidateSha256']==inputs['files']['alkarna-1.0.39-v40.apk'] and result['testApkSha256']==inputs['files']['app-release-androidTest.apk']
              if result['mode']=='native':assert result['nativeTestCount']==75
              else:assert len(result['checks'])==8 and all(c['passed'] for c in result['checks'])
              results.append(result)
          assert len(results)==3 and sum(r['mode']=='native' for r in results)==1 and {int(r['baseline']) for r in results if r['mode']=='upgrade'}=={27,39}
          apk=Path('build-parity0130/alkarna-1.0.39-v40.apk');assert hashlib.sha256(apk.read_bytes()).hexdigest()==inputs['files'][apk.name]
          out=Path('verified-candidate');out.mkdir();(out/apk.name).write_bytes(apk.read_bytes());(out/'verification.json').write_text(json.dumps({'inputs':inputs,'results':results},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: parity0130-v40-verified-update
          path: verified-candidate/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
