name: Contatools distribution candidate v30
on:
  push:
    branches: [main, feat/shared-phone-desktop-20261112]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: candidate-v30-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verified_bytes:
    # Main and every PR retain the unsigned native gate. Only this owner-approved
    # release branch and main can enter artifact reuse or the job with signing secrets.
    if: >-
      github.repository == 'lami216/Contamobile' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/shared-phone-desktop-20261112')
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.prior.outputs.run_id }}
    steps:
      - name: Reuse only a fully verified artifact from this exact commit
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',path],text=True))
          repo=os.environ['GITHUB_REPOSITORY'];sha=os.environ['GITHUB_SHA'];found=''
          runs=api(f'repos/{repo}/actions/workflows/contatools-candidate.yml/runs?head_sha={sha}&status=completed&per_page=30')['workflow_runs']
          for run in runs:
              if run['head_sha']!=sha or run['conclusion']!='success':continue
              if run['event'] not in ['push','workflow_dispatch'] or run['head_branch'] not in ['main','feat/shared-phone-desktop-20261112']:continue
              artifacts=api(f'repos/{repo}/actions/runs/{run["id"]}/artifacts')['artifacts']
              names={a['name'] for a in artifacts if not a['expired'] and a['size_in_bytes']>0}
              if {'alkarna-candidate-v30','alkarna-candidate-v30-proof'}<=names:
                  found=str(run['id']);break
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('run_id='+found+'\n')
          if found:
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:out.write(f'Exact tested APK retained from [verified run {found}](https://github.com/{repo}/actions/runs/{found}) for commit {sha}.\n')
          PY
  runtime_access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Install isolated pinned browser test tools
        run: |
          npm install --prefix ui-tools --no-save --package-lock=false playwright@1.62.1
          ui-tools/node_modules/.bin/playwright install chromium
          python3 scripts/prepare-approved-dependencies.py
      - name: Verify dual access, financial receipts, privacy, navigation and camera messages
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/ui-tools/node_modules/playwright
          PLAYWRIGHT_USE_BUNDLED: '1'
        run: |
          node --test scripts/test-android-access.mjs scripts/test-shared-delta.mjs
          node scripts/test-android-access-ux.mjs
          node scripts/test-play-readiness-ux.mjs
  native_compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Prepare exact pinned runtime and independent test-only license fixtures
        run: |
          python3 scripts/prepare-approved-dependencies.py
          python3 scripts/prepare-approved-android.py
          node scripts/prepare-license-fixtures.mjs
      - name: Compile native app and instrumentation and run JVM tests without release credentials
        run: |
          gradle -p approved-android -PalkarnaAuditDebugTests=true -PalkarnaVersionCode=30 -PalkarnaVersionName=1.0.29 :app:testDebugUnitTest :app:compileDebugAndroidTestJavaWithJavac --rerun-tasks --no-daemon --stacktrace
          python3 scripts/verify-native-jvm-results.py approved-android/app/build/test-results/testDebugUnitTest approved-android/app/build/test-results/testDebugUnitTest/execution-summary.json
      - name: Retain independent native preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alkarna-native-compile-v30-proof
          path: |
            approved-android/app/build/reports/tests
            approved-android/app/build/test-results/testDebugUnitTest
          retention-days: 30
          if-no-files-found: warn
  current_v25_acceptance:
    # Re-execute the unmodified delivered v25 and its exact original test APK.
    # This is Android instrumentation with injected transport, not a real phone
    # or an Android-to-production/full-stack service claim.
    if: >-
      github.repository == 'lami216/Contamobile' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/shared-phone-desktop-20261112')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lami216/Contamobile
          ref: 6dd9c848f6358eeb8c280350e734d8c055292ac8
          path: existing-v25-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Read exact existing APKs and original v25 instrumentation, never rebuild them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/lami216/Contamobile/actions/runs/42037386484 --jq .head_sha)" = 6dd9c848f6358eeb8c280350e734d8c055292ac8
          test "$(gh api repos/lami216/Contamobile/actions/runs/42037386484 --jq .conclusion)" = success
          gh run download 42037386484 --repo lami216/Contamobile --name alkarna-candidate-v25 --dir existing-v25
          gh run download 42037386484 --repo lami216/Contamobile --name alkarna-candidate-v25-proof --dir existing-v25-evidence
          mkdir -p existing-v17 v25-acceptance-proof
          test "$(gh api repos/lami216/Contamobile/actions/runs/40924226676 --jq .head_sha)" = a1ff5140cb14ff659158663368f1d498e7160aef
          test "$(gh api repos/lami216/Contamobile/actions/runs/40924226676 --jq .conclusion)" = success
          gh run download 40924226676 --repo lami216/Contamobile --name alkarna-candidate-v17 --dir existing-v17
          echo 'Original signed v17 from verified GitHub artifact; no production access.' > v25-acceptance-proof/v17-download-origin.txt
          echo "4ea578e57144431cfc2aab9902f717834ba5f1e8936e3e77141f12d66cc10b9a  existing-v17/alkarna-1.0.16-v17.apk" | sha256sum --check
          echo "ceca18d43dceb2dd952923410b8c6c4e3c93157b2a56f338d0c64c311cce8cd4  existing-v25/alkarna-1.0.24-v25.apk" | sha256sum --check
          echo "181ed0837e0e080c1dae9c19c5e5ba3c5508d7a1f98c54aa5a756bf5b4ab2580  existing-v25-evidence/candidate-proof/app-release-androidTest.apk" | sha256sum --check
          python3 scripts/verify-approved-signature.py existing-v17/alkarna-1.0.16-v17.apk existing-v25/alkarna-1.0.24-v25.apk existing-v25-evidence/candidate-proof/app-release-androidTest.apk | tee v25-acceptance-proof/signatures.txt
      - name: Enable disposable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare bounded emulator-only root readiness for unchanged v25 tests
        run: |
          cat > "$RUNNER_TEMP/current-v25-ready.sh" <<'SH'
          set -euo pipefail
          mkdir -p v25-acceptance-proof
          log=v25-acceptance-proof/root-readiness.txt
          : > "$log"
          ready=false
          for attempt in 1 2 3; do
            echo "root readiness attempt $attempt" >> "$log"
            if ! timeout 30s adb wait-for-device >> "$log" 2>&1; then continue; fi
            emulator=''
            if emulator=$(timeout 10s adb shell getprop ro.kernel.qemu 2>> "$log" | tr -d '\r'); then :; else emulator=''; fi
            if [ "$emulator" != 1 ]; then
              if [ -n "$emulator" ]; then echo 'Not an emulator; refusing root' >> "$log"; cat "$log"; exit 1; fi
              continue
            fi
            uid=''
            if uid=$(timeout 10s adb shell id -u 2>> "$log" | tr -d '\r'); then :; else uid=''; fi
            if [ "$uid" = 0 ]; then ready=true; break; fi
            if timeout 15s adb root >> "$log" 2>&1; then :; else
              echo 'Root request transport closed; verifying actual readiness' >> "$log"
            fi
            if timeout 30s adb wait-for-device >> "$log" 2>&1; then
              uid=''; emulator=''
              if uid=$(timeout 10s adb shell id -u 2>> "$log" | tr -d '\r'); then :; else uid=''; fi
              if emulator=$(timeout 10s adb shell getprop ro.kernel.qemu 2>> "$log" | tr -d '\r'); then :; else emulator=''; fi
              if [ "$uid" = 0 ] && [ "$emulator" = 1 ]; then ready=true; break; fi
            fi
            if [ "$attempt" -lt 3 ]; then sleep 1; fi
          done
          cat "$log"
          test "$ready" = true
          # No test or business operation is retried or modified.
          exec bash scripts/test-current-v25-acceptance.sh
          SH
      - name: Current v25 Android injected-transport cases, v17 upgrade and same-v25 idempotent reinstall
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash "$RUNNER_TEMP/current-v25-ready.sh"
      - name: Keep only synthetic acceptance logs and honest scope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alkarna-v25-existing-apk-acceptance-proof
          path: v25-acceptance-proof
          retention-days: 30
          if-no-files-found: error
