name: Contatools distribution candidate v18
on:
  push:
    branches: [audit/data-integrity-20261029, feat/live-contatools-light-sync-20261027]
    paths: ['approved-android/**', 'approved-runtime/**', 'scripts/verify-candidate-apk.py', 'scripts/verify-contatools-apk.py', 'scripts/test-candidate-upgrade.sh', '.github/workflows/contatools-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: candidate-v18-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verified_bytes:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.prior.outputs.run_id }}
    steps:
      - name: Reuse only a fully verified artifact from this exact commit
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',path],text=True))
          repo=os.environ['GITHUB_REPOSITORY'];sha=os.environ['GITHUB_SHA'];found=''
          if os.environ['GITHUB_EVENT_NAME']!='workflow_dispatch':
              runs=api(f'repos/{repo}/actions/workflows/contatools-candidate.yml/runs?head_sha={sha}&status=completed&per_page=30')['workflow_runs']
              for run in runs:
                  if run['head_sha']!=sha or run['conclusion']!='success':continue
                  artifacts=api(f'repos/{repo}/actions/runs/{run["id"]}/artifacts')['artifacts']
                  names={a['name'] for a in artifacts if not a['expired'] and a['size_in_bytes']>0}
                  if {'alkarna-candidate-v18','alkarna-candidate-v18-proof'}<=names:
                      found=str(run['id']);break
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('run_id='+found+'\n')
          if found:
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:out.write(f'Exact tested APK retained from [verified run {found}](https://github.com/{repo}/actions/runs/{found}) for commit {sha}.\n')
          PY
  candidate:
    needs: verified_bytes
    if: needs.verified_bytes.outputs.run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CANDIDATE_VERSION_CODE: '18'
      CANDIDATE_APK: candidate-output/alkarna-1.0.17-v18.apk
      BASELINE_VERSION_CODES: '13 14 15 16 17'
      ALKARNA_HIGHEST_DISTRIBUTED_CODE: '17'
      ALKARNA_PREVIOUS_APK_SHA256: 4ea578e57144431cfc2aab9902f717834ba5f1e8936e3e77141f12d66cc10b9a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Download the owner-confirmed actually distributed APK, never reconstruct it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/lami216/Contamobile/actions/runs/40202607079 --jq .head_sha)" = ffb5cfd571681a9760dc4d6f76a9ff14488407e5
          gh run download 40202607079 --repo lami216/Contamobile --name alkarna-approved-apk --dir baseline-v14
          test "$(gh api repos/lami216/Contamobile/actions/runs/39312062039 --jq .head_sha)" = 1efb01fc1cd7bc62670510e57c6158734ad4bf05
          gh run download 39312062039 --repo lami216/Contamobile --name alkarna-approved-apk --dir baseline-v13
          echo "9c6f9ccc5000b58864191f2e6003d79560c811aa7190878620cb1900a61cfe8c  baseline-v13/alkarna-approved.apk" | sha256sum --check
          echo "4d69fc1f88d4709d4928c906e15801ff2028995ad0131d611e946973bb831c90  baseline-v14/alkarna-approved.apk" | sha256sum --check
          mkdir -p candidate-output baseline-v15 baseline-v16 baseline-v17
          curl --fail --silent --show-error --location https://3ali.store/downloads/alkarna-1.0.14-v15.apk -o baseline-v15/alkarna-approved.apk
          curl --fail --silent --show-error --location https://3ali.store/downloads/alkarna-1.0.15-v16.apk -o baseline-v16/alkarna-approved.apk
          curl --fail --silent --show-error --location https://3ali.store/downloads/alkarna-1.0.16-v17.apk -o baseline-v17/alkarna-approved.apk
          echo "6204cfe04ce59acb2d4e089bb9d1711524949441e04b05d5b10b0c985ff7b74d  baseline-v15/alkarna-approved.apk" | sha256sum --check
          echo "4b896ca65abe0ca8ec9e766c48f66442f0aa82dcbc24696f47d6cf52ea0ade7d  baseline-v16/alkarna-approved.apk" | sha256sum --check
          python3 scripts/verify-candidate-apk.py baseline baseline-v17/alkarna-approved.apk > candidate-output/baseline-verified.json
      - name: Verify every original baseline retains the permanent identity
        run: python3 scripts/verify-approved-signature.py baseline-v13/alkarna-approved.apk baseline-v14/alkarna-approved.apk baseline-v15/alkarna-approved.apk baseline-v16/alkarna-approved.apk baseline-v17/alkarna-approved.apk
      - name: Existing source checks and deterministic scheduling policy
        run: |
          bash -n scripts/test-candidate-upgrade.sh
          python3 scripts/prepare-approved-dependencies.py
          node --test scripts/test-service-contact.mjs
          java scripts/RegistrationPolicyCheck.java
          node scripts/verify-approved-source-navigation.mjs
          node scripts/verify-report-sources.mjs
          node scripts/verify-party-summaries.mjs
          node scripts/verify-french-locale.mjs
          node scripts/verify-feature-domains.mjs
          node scripts/verify-import-features.mjs
          python3 scripts/prepare-approved-android.py
          node scripts/prepare-license-fixtures.mjs
      - name: Real browser integrity gate for these exact release sources
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/release-audit-tools/node_modules/playwright
          PLAYWRIGHT_USE_BUNDLED: '1'
        run: |
          npm install --prefix "$RUNNER_TEMP/release-audit-tools" --no-package-lock --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/release-audit-tools/node_modules/playwright/cli.js" install --with-deps chromium
          node scripts/test-storage-integrity.mjs
          node scripts/test-runtime-integrity.mjs
          node scripts/test-user-integrity.mjs
          node scripts/test-import-html-escaping.mjs
          node --test scripts/test-import-allocation.mjs scripts/test-native-adapter.mjs scripts/test-native-save-boundary.mjs
      - name: Existing permanent release identity only
        env:
          ALKARNA_SIGNING_BUNDLE: ${{ secrets.ALKARNA_SIGNING_BUNDLE }}
        run: python3 scripts/prepare-approved-signing.py
      - name: Build ONCE with actual public production settings and explicit version
        run: |
          gradle -p approved-android :app:assembleRelease :app:assembleReleaseAndroidTest :app:testReleaseUnitTest -PalkarnaVersionCode=18 -PalkarnaVersionName=1.0.17 --no-daemon --stacktrace
          cp approved-android/app/build/outputs/apk/release/app-release.apk candidate-output/alkarna-1.0.17-v18.apk
          python3 scripts/verify-candidate-apk.py candidate candidate-output/alkarna-1.0.17-v18.apk > candidate-output/candidate-verified.json
          python3 scripts/verify-activation-package.py candidate-output/alkarna-1.0.17-v18.apk
          python3 scripts/verify-approved-signature.py baseline-v13/alkarna-approved.apk baseline-v14/alkarna-approved.apk baseline-v15/alkarna-approved.apk baseline-v16/alkarna-approved.apk baseline-v17/alkarna-approved.apk candidate-output/alkarna-1.0.17-v18.apk
          sha256sum candidate-output/alkarna-1.0.17-v18.apk > candidate-output/SHA256SUMS.txt
      - name: Enable disposable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exact original v13, v14, v15, v16 and official v17 to v18 updates, temporary and perpetual, and native launcher shortcut
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/test-candidate-upgrade.sh
      - name: Preserve exact tested customer bytes
        uses: actions/upload-artifact@v4
        with:
          name: alkarna-candidate-v18
          path: candidate-output/alkarna-1.0.17-v18.apk
          compression-level: 0
          retention-days: 90
      - name: Separate integration-test APK and public inspection evidence
        run: |
          mkdir -p candidate-proof/inspection-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" candidate-proof/inspection-tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt" candidate-proof/inspection-tools/aapt
          cp approved-android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk candidate-proof/app-release-androidTest.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alkarna-candidate-v18-proof
          path: |
            candidate-proof
            candidate-output/*.json
            candidate-output/*.txt
            approved-android/app/build/reports/tests
          retention-days: 30
      - name: Remove ephemeral signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/alkarna-signing/release.p12"
