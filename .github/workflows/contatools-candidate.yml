          echo "ef3b276c51c7cfb92616080d1b8145dce2a7a4b6c48198356bdec9b34eaf59a4  baseline-v18/alkarna-approved.apk" | sha256sum --check
          test "$(gh api repos/lami216/Contamobile/actions/runs/41264015644 --jq .head_sha)" = 7742c98594fee76d50aab4f749c8c9850a059552
          test "$(gh api repos/lami216/Contamobile/actions/runs/41264015644 --jq .conclusion)" = success
          gh run download 41264015644 --repo lami216/Contamobile --name alkarna-candidate-v19 --dir baseline-v19
          mv baseline-v19/alkarna-1.0.18-v19.apk baseline-v19/alkarna-approved.apk
          echo "c5558a074e48c5705f10ef20b233d39d33ee1ccc3b91d5c0bfe1c745d0153f3e  baseline-v19/alkarna-approved.apk" | sha256sum --check
          test "$(gh api repos/lami216/Contamobile/actions/runs/41344455418 --jq .head_sha)" = 69fff273bc3dea02fd0780e97f31510a6948aecd
          test "$(gh api repos/lami216/Contamobile/actions/runs/41344455418 --jq .conclusion)" = success
          gh run download 41344455418 --repo lami216/Contamobile --name alkarna-candidate-v20 --dir baseline-v20
          mv baseline-v20/alkarna-1.0.19-v20.apk baseline-v20/alkarna-approved.apk
          echo "94848194716a6a794182ae4eb86d29af471899b79bc3a6c011903e58613c52e4  baseline-v20/alkarna-approved.apk" | sha256sum --check
          test "$(gh api repos/lami216/Contamobile/actions/runs/41358801608 --jq .head_sha)" = b74e053a6b42c367d93577ab7c71612be12b4dd0
          test "$(gh api repos/lami216/Contamobile/actions/runs/41358801608 --jq .conclusion)" = success
          gh run download 41358801608 --repo lami216/Contamobile --name alkarna-candidate-v21 --dir baseline-v21
          mv baseline-v21/alkarna-1.0.20-v21.apk baseline-v21/alkarna-approved.apk
          echo "8c662cc4b98578bacf04b60fbe302a4222a5aba8f4578d181dcb961c13554f90  baseline-v21/alkarna-approved.apk" | sha256sum --check
          test "$(gh api repos/lami216/Contamobile/actions/runs/41450759327 --jq .head_sha)" = 21efba6a5c3772ba4b4a568a8b17f6d70728690c
          test "$(gh api repos/lami216/Contamobile/actions/runs/41450759327 --jq .conclusion)" = success
          gh run download 41450759327 --repo lami216/Contamobile --name alkarna-candidate-v22 --dir baseline-v22
          mv baseline-v22/alkarna-1.0.21-v22.apk baseline-v22/alkarna-approved.apk
          echo "88e85413785a0a969f96a7545ae0d3eaf3f0dfce2b99373199610df0a84266cd  baseline-v22/alkarna-approved.apk" | sha256sum --check
          test "$(gh api repos/lami216/Contamobile/actions/runs/41464198663 --jq .head_sha)" = 1efa3058013d2da2cf17927ac10dfd5a4ca6083e
          test "$(gh api repos/lami216/Contamobile/actions/runs/41464198663 --jq .conclusion)" = success
          gh run download 41464198663 --repo lami216/Contamobile --name alkarna-candidate-v23 --dir baseline-v23
          mv baseline-v23/alkarna-1.0.22-v23.apk baseline-v23/alkarna-approved.apk
          echo "fd337af2516d614319c4cbd2d61b29ca0b55e83e96c577df544020879dcaf587  baseline-v23/alkarna-approved.apk" | sha256sum --check
          test "$(gh api repos/lami216/Contamobile/actions/runs/41679166581 --jq .head_sha)" = 82053ae1e0172b5f131e2108f1e2cc91fe6ffe30
          test "$(gh api repos/lami216/Contamobile/actions/runs/41679166581 --jq .conclusion)" = success
          gh run download 41679166581 --repo lami216/Contamobile --name alkarna-candidate-v24 --dir baseline-v24
          mv baseline-v24/alkarna-1.0.23-v24.apk baseline-v24/alkarna-approved.apk
          echo "cc8f16481f1f185a29a089fd2c73c6b593db65dd6d672a53178ba485370c2a6c  baseline-v24/alkarna-approved.apk" | sha256sum --check
          test "$(gh api repos/lami216/Contamobile/actions/runs/42037386484 --jq .head_sha)" = 6dd9c848f6358eeb8c280350e734d8c055292ac8
          test "$(gh api repos/lami216/Contamobile/actions/runs/42037386484 --jq .conclusion)" = success
          gh run download 42037386484 --repo lami216/Contamobile --name alkarna-candidate-v25 --dir baseline-v25
          mv baseline-v25/alkarna-1.0.24-v25.apk baseline-v25/alkarna-approved.apk
          echo "ceca18d43dceb2dd952923410b8c6c4e3c93157b2a56f338d0c64c311cce8cd4  baseline-v25/alkarna-approved.apk" | sha256sum --check
          python3 scripts/verify-candidate-apk.py baseline baseline-v25/alkarna-approved.apk > candidate-output/baseline-verified.json
      - name: Verify every original baseline retains the permanent identity
        run: python3 scripts/verify-approved-signature.py baseline-v13/alkarna-approved.apk baseline-v14/alkarna-approved.apk baseline-v15/alkarna-approved.apk baseline-v16/alkarna-approved.apk baseline-v17/alkarna-approved.apk baseline-v18/alkarna-approved.apk baseline-v19/alkarna-approved.apk baseline-v20/alkarna-approved.apk baseline-v21/alkarna-approved.apk baseline-v22/alkarna-approved.apk baseline-v23/alkarna-approved.apk baseline-v24/alkarna-approved.apk baseline-v25/alkarna-approved.apk
