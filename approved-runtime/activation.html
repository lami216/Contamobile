<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e19"><title>تفعيل الكرنه</title><link rel="stylesheet" href="activation.css"></head><body><main class="activation"><header><span class="mark" aria-hidden="true">◇</span><span class="brand">الكرنه</span></header><section class="license-card"><p class="eyebrow" id="eyebrow">ترخيص الجهاز</p><h1 id="title">تفعيل هذا الهاتف</h1><p class="intro" id="intro">انسخ كود الجهاز إلى أداة التفعيل على الكمبيوتر، ثم اختر ملف الترخيص الذي تصدره الأداة.</p><div class="device"><label id="device-label" for="device-code">كود الجهاز</label><output id="device-code" dir="ltr">…</output><button type="button" id="copy-code">نسخ الكود</button></div><div id="license-info" class="license-info" hidden></div><div id="status" role="status" aria-live="polite"></div><label class="file-button" id="file-label"><span id="file-text">اختيار ملف التفعيل</span><input type="file" id="license-file" accept=".alkarna-license,.json,application/json,application/octet-stream"></label><p class="filename" id="filename"></p><details><summary id="paste-title">لصق محتوى ملف الترخيص</summary><label class="sr-only" id="paste-label" for="license-text">محتوى ملف الترخيص</label><textarea id="license-text" dir="ltr" rows="5" maxlength="65536" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea><button id="install-text" type="button">تفعيل الترخيص</button></details><button id="continue" class="continue" hidden>فتح التطبيق</button><p class="footnote" id="footnote">التفعيل يعمل دون إنترنت. بيانات المحل تبقى محفوظة.</p></section></main><script src="activation.js"></script></body></html>
